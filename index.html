*{box-sizing:border-box}body{margin:0;font:17px/1.55 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#24344d;background:linear-gradient(160deg,#c9f1ff,#fff3c4 55%,#ffd6e0) fixed;min-height:100vh}
#deco span{position:fixed;font-size:34px;opacity:.35;pointer-events:none;animation:fl 9s ease-in-out infinite;z-index:0}@keyframes fl{50%{transform:translateY(-22px) rotate(12deg)}}
#app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:12px}
header.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:20px;padding:8px 12px;border:3px solid #ffb703}
.bar{flex:1;min-width:110px;height:16px;background:#e6edf5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2ec4b6,#ffb703);transition:width .5s}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:10px 18px;min-height:46px;background:#ff6b6b;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18)}button:active{transform:translateY(3px);box-shadow:none}
button.alt{background:#2ec4b6}button.gh{background:#fff;color:#24344d;border:3px solid #cbd5e1}button:disabled{opacity:.5}
h1,h2,h3{margin:.3em 0;color:#1d4e89}input,textarea,select{font:inherit;padding:10px;border-radius:12px;border:3px solid #cbd5e1;width:100%}
.card{background:#fff;border-radius:22px;padding:16px;border:3px solid #ffd166;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.grid .card{margin:0}
.menu{display:block;width:100%;text-align:left;background:#fff;color:#24344d;border:4px solid;min-height:92px;position:relative}.menu small{display:block;font-weight:400}.menu b.ck{position:absolute;right:10px;top:8px}
svg{width:100%;height:auto;max-height:80vh}.org{cursor:pointer;fill:rgba(0,0,0,0);pointer-events:all}.org.sel{stroke:#ff9f1c;stroke-width:5;stroke-linejoin:round;animation:pu 1s infinite alternate}@keyframes pu{to{stroke-opacity:.3}}
.lbl{font-size:17px;font-weight:700;fill:#24344d;cursor:pointer}.lbl.sel{fill:#d00000}.ln{stroke:#475569;stroke-width:1.5;pointer-events:none}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;align-items:start}@media(max-width:720px){.two{grid-template-columns:1fr}}
.lg{display:flex;flex-wrap:wrap;gap:6px}.lg button{min-height:38px;padding:4px 12px;font-size:15px;background:#fff;color:#24344d;border:3px solid}
.row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin:8px 0}@media(max-width:600px){.row{grid-template-columns:1fr}}
.cs{background:#e0f2fe;border-radius:14px;padding:10px;font-weight:700}.zone{border:3px dashed #94a3b8;border-radius:14px;padding:10px;min-height:52px;color:#64748b}.zone.done{border:3px solid #22c55e;background:#dcfce7;color:#14532d}
.chip{background:#fef3c7;border:3px solid #fbbf24;border-radius:14px;padding:8px 10px;margin:6px 0;cursor:grab}.chip.sel{background:#fde68a;outline:4px solid #ff6b6b}
.shake{animation:sk .4s}@keyframes sk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.slot{display:inline-block;min-width:96px;text-align:center;border:3px dashed #94a3b8;border-radius:12px;padding:6px;margin:3px}.slot.f{border:3px solid #22c55e;background:#dcfce7}
.fb{padding:10px;border-radius:12px}.fb.g{background:#dcfce7}.fb.r{background:#fee2e2}details{background:#fff;border-radius:16px;border:3px solid #a5d8ff;padding:8px 12px;margin:8px 0}summary{font-weight:700;cursor:pointer}
.tip{cursor:pointer;border-color:#cbd5e1}.tip.on{border-color:#22c55e;background:#f0fdf4}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

R.intro=()=>`<h2>💡 Apa Itu Sistem Pencernaan?</h2><div class="card"><p>Pernahkah perutmu keroncongan setelah lama tidak makan? Makanan memberi <b>tenaga</b> untuk bermain, belajar, dan tumbuh. Namun nasi, sayur, dan lauk yang kamu telan masih berukuran besar, jadi tubuh belum bisa memakainya.</p><p><b>Sistem pencernaan</b> adalah kumpulan organ yang bekerja sama untuk <b>mengubah makanan menjadi zat gizi sederhana</b> yang dapat diserap darah, lalu membuang sisanya. Bayangkan tubuhmu punya <b>pabrik pengolah makanan</b>!</p></div><h3>Empat tugas sistem pencernaan</h3><div class="grid">${[['🍽️','1. Memasukkan makanan','Makanan dimasukkan lewat mulut.'],['⚙️','2. Memecah makanan','Secara mekanis (dikunyah dan diremas) dan kimiawi (dengan enzim).'],['🩸','3. Menyerap zat gizi','Sari makanan masuk ke darah, terutama lewat usus halus.'],['🚽','4. Membuang sisa','Sisa yang tidak terserap keluar sebagai tinja lewat anus.']].map(c=>`<div class="card"><div style="font-size:34px">${c[0]}</div><b>${c[1]}</b><p>${c[2]}</p></div>`).join('')}</div><div class="card" style="border-color:#2ec4b6"><h3>Dua kelompok organ</h3><p><b>Saluran pencernaan</b> (makanan lewat): mulut, kerongkongan, lambung, usus halus, usus besar, rektum, anus.</p><p><b>Organ pendukung</b> (makanan tidak lewat): hati, kantung empedu, pankreas. Mereka membuat cairan dan enzim pembantu.</p></div><div class="card"><h3>🤔 Coba pikirkan</h3><details><summary>Mengapa makanan harus dicerna dulu?</summary><p>Zat gizi hanya bisa masuk ke darah jika sudah sangat kecil. Pencernaan memecah makanan sampai sekecil itu.</p></details><details><summary>Apakah makanan masuk ke dalam hati?</summary><p>Tidak. Hati hanya membuat empedu dan membantu proses lain, jadi termasuk organ pendukung.</p></details></div>`;

R.guru=()=>{if(!GOK)return `<div class="card" style="max-width:420px;margin:6vh auto"><h2>👩‍🏫 Mode Guru</h2><p>${LS('cernaku_pin')?'Masukkan PIN guru.':'Buat PIN guru (untuk pertama kali).'}</p><input id="pin" type="password" placeholder="PIN"><br><br><button onclick="gpin()">Masuk</button> <button class="gh" onclick="go(S.name?'dash':'login')">Kembali</button><p id="er" style="color:#c00"></p></div>`;
GL=Object.entries(RS).sort((a,b)=>(a[1].kelas+a[1].name).localeCompare(b[1].kelas+b[1].name,'id'));const av=f=>GL.length?Math.round(GL.reduce((t,x)=>t+(f(x[1])||0),0)/GL.length):0,hb=x=>H.filter((_,i)=>x.h&&x.h[i]).length;
return `<h2>👩‍🏫 Hasil Belajar Siswa</h2><div class="card"><p>Jumlah siswa: <b>${GL.length}</b> · Rata-rata progres: <b>${av(x=>x.p)}%</b> · Rata-rata nilai terbaik: <b>${av(x=>x.best)}</b></p><button class="alt" onclick="csv()">⬇️ Unduh CSV</button> <button class="gh" onclick="GOK=false;go('login')">Keluar</button></div><div class="card" style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><tr style="background:#e0f2fe"><th>Nama</th><th>Kelas</th><th>Progres</th><th>Nilai terakhir</th><th>Nilai terbaik</th><th>Kebiasaan sehat</th><th>Terakhir belajar</th><th></th></tr>${GL.map((e,i)=>{const x=e[1];return `<tr style="border-top:1px solid #ddd"><td>${esc(x.name)}</td><td>${esc(x.kelas)}</td><td>${x.p||0}%</td><td>${x.last??'-'}</td><td>${x.best??'-'}</td><td>${hb(x)}/${H.length}</td><td>${x.t?new Date(x.t).toLocaleString('id-ID'):'-'}</td><td><button class="gh" style="min-height:34px;padding:2px 10px" onclick="del(${i})">🗑️</button></td></tr>`}).join('')||'<tr><td colspan="8">Belum ada siswa.</td></tr>'}</table></div><div class="card"><h3>📥 Tambah hasil dari perangkat lain</h3><p>Data tersimpan di perangkat tempat siswa belajar. Minta siswa menekan <b>Salin kode hasil</b> di halaman Rangkuman, lalu tempel kodenya di sini (satu kode per baris).</p><textarea id="cd" rows="3"></textarea><br><br><button onclick="imp()">Tambahkan</button></div><p><small>PIN hanya pembatas sederhana di browser ini, bukan pengaman kuat.</small></p>`};
function gpin(){const p=$('#pin').value,s=LS('cernaku_pin');if(!p)return;if(!s){LS('cernaku_pin',p);GOK=true}else if(p===s)GOK=true;else{$('#er').textContent='PIN salah.';snd('no');return}go('guru')}
function del(i){if(confirm('Hapus data siswa ini?')){delete RS[GL[i][0]];LS('cernaku_rs',RS);if(GL[i][0]==KY()){S={v:{},h:{},r:{}};LS('cernaku_cur',null)}go('guru')}}
function csv(){const r=[['Nama','Kelas','Progres%','NilaiTerakhir','NilaiTerbaik','KebiasaanSehat','TerakhirBelajar']].concat(GL.map(([k,x])=>[x.name,x.kelas,x.p||0,x.last??'',x.best??'',H.filter((_,i)=>x.h&&x.h[i]).length,x.t?new Date(x.t).toLocaleString('id-ID'):'']));const t='\ufeff'+r.map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='hasil-cernaku.csv';a.click()}
function kode(){const c=btoa(unescape(encodeURIComponent(JSON.stringify({name:S.name,kelas:S.kelas,p:pct(),last:S.last,best:S.best,h:S.h,v:S.v,t:Date.now()}))));(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>alert('Kode hasil sudah disalin. Kirimkan ke gurumu.'),()=>prompt('Salin kode ini lalu kirim ke gurumu:',c))}
function imp(){let n=0;$('#cd').value.split(/\s+/).filter(Boolean).forEach(c=>{try{const x=JSON.parse(decodeURIComponent(escape(atob(c)))),nm=String(x.name||'').slice(0,40),kl=String(x.kelas||'').slice(0,10),num=v=>typeof v=='number'&&isFinite(v)?v:null;if(!nm)return;const k=(nm+'|'+kl).toLowerCase(),o=RS[k];if(o&&o.t>x.t)return;const b=q=>{const r={};if(q&&typeof q=='object')Object.keys(q).slice(0,20).forEach(i=>{if(q[i])r[i]=1});return r};RS[k]={name:nm,kelas:kl,p:num(x.p)||0,last:num(x.last),best:num(x.best),h:b(x.h),v:b(x.v),r:{},t:num(x.t)||Date.now()};n++}catch(e){}});LS('cernaku_rs',RS);alert(n+' data siswa ditambahkan.');go('guru')}

function login(){const n=$('#nm').value.trim(),k=$('#kl').value.trim();if(!n){$('#er').textContent='Tulis namamu dulu ya!';return}S=RS[(n+'|'+(k||'6')).toLowerCase()]||{name:n,kelas:k||'6',v:{},h:{},r:{}};save();snd('ok');go('dash')}
function go(id){clearInterval(T);cancelAnimationFrame(raf);cur=id;const app=$('#app');
if(id=='login'){app.innerHTML=`<div class="card" style="max-width:480px;margin:6vh auto;text-align:center"><div style="font-size:48px">🍎🥦🦷</div><h1>CERNAKU</h1><p>Kenali Organ, Pahami Cara Kerjanya!</p><p style="text-align:left"><b>Namamu:</b><input id="nm" maxlength="40" placeholder="Tulis namamu"><br><br><b>Kelasmu:</b><input id="kl" maxlength="10" value="6" placeholder="Contoh: 6A"></p><p id="er" style="color:#c00"></p><button onclick="login()">Masuk 🚀</button> <button class="gh" onclick="go('guru')">👩‍🏫 Mode Guru</button></div>`;return}
if(['intro','organ','fungsi','jalan','sakit','sehat'].includes(id)){S.v[id]=1;save()}
const i=P.findIndex(p=>p[0]==id),nav=i<0?'':`<div class="nav"><button class="gh" ${i?'':'disabled'} onclick="go('${P[i-1]?.[0]}')">◀ Sebelumnya</button><span>Halaman ${i+1} dari ${P.length}</span><button ${i<P.length-1?'':'disabled'} onclick="go('${P[i+1]?.[0]}')">Berikutnya ▶</button></div>`;
app.innerHTML=`<header class="top"><b style="font-size:20px">🦷 CERNAKU</b><div class="bar"><i style="width:${pct()}%"></i></div><b>${pct()}%</b><button class="gh" onclick="go('dash')">🏠 Dasbor</button><button class="gh" onclick="tm()" aria-label="Suara">${mute?'🔇':'🔊'}</button></header><main>${R[id]()}</main>${nav}`;(A[id]||(()=>{}))();scrollTo(0,0)}
go(S.name?'dash':'login');
</script></body></html>
